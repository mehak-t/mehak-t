<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 60" width="640" height="60">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4.5" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.0208;0.2292;0.25;1.0" dur="12s" begin="0s" repeatCount="indefinite" calcMode="linear"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
          font-family="Fira Code, Consolas, monospace" font-size="22" font-weight="600"
          fill="#ec48c9" filter="url(#glow)">I make pixels dance</text>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
          font-family="Fira Code, Consolas, monospace" font-size="22" font-weight="600"
          fill="#fdeaf7">I make pixels dance</text>
  </g>
