<svg xmlns="http://www.w3.org/2000/svg" width="154" height="52" viewBox="0 0 154 52">
  <defs>
    <filter id="glow-status-active" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="labelGrad-status-active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1f2e"/>
      <stop offset="100%" stop-color="#12141f"/>
    </linearGradient>
  </defs>

  <g transform="translate(12,12)">
    <rect x="68" y="0" width="62" height="28" rx="14.0"
          fill="#39FF6A" filter="url(#glow-status-active)" opacity="0.4"/>

    <rect x="0" y="0" width="58" height="28" rx="14.0"
          fill="url(#labelGrad-status-active)" stroke="#39FF6A" stroke-opacity="0.25" stroke-width="1"/>

    <rect x="68" y="0" width="62" height="28" rx="14.0" fill="#39FF6A"/>

    <text x="29.0" y="18.0" font-family="Verdana, Geneva, sans-serif" font-size="10.5" font-weight="bold"
          fill="#c7cad4" text-anchor="middle" letter-spacing="0.3">Status</text>

    <text x="99.0" y="18.0" font-family="Verdana, Geneva, sans-serif" font-size="10.5" font-weight="bold"
          fill="#0a0c14" text-anchor="middle" letter-spacing="0.3">Active</text>
  </g>
</svg>