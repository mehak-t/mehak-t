<svg xmlns="http://www.w3.org/2000/svg" width="188" height="52" viewBox="0 0 188 52">
  <defs>
    <filter id="glow-status-ideation" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
